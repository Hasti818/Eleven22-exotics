spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eleven22_exotics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # fine for a portfolio project; use Flyway migrations in production
    open-in-view: false
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET}            # at least 32 characters
    expiration-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@eleven22.dk}
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
